# GenuineFan Player fork: this workflow is inherited from upstream Musike. Its automatic tag trigger is removed
# so pushing a v* tag to the fork never builds or publishes anything. It can still be started by hand from the
# Actions tab, which would publish artifacts publicly: don't, while playback relies on YouTube extraction
# (see docs/genuinefan-integration.md).
#
# Upstream description: builds the Docker image for every release tag (v1.2.0 → :1.2.0, :1.2 and :latest) and publishes it
# to GitHub Container Registry as ghcr.io/<owner>/musike. Can also be started by hand from the Actions tab.
name: Docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase (the owner here is "Ernani1234").
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
